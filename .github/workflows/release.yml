name: Release tag

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-tag:
    permissions:
      contents: write
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-tag.yml@ec2bc59ca49b34ab63cf712c9da5201b73d749db
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
