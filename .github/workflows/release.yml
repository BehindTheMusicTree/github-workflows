name: Release tag

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-tag:
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-tag.yml@7857565a0fbbf7a4569147044d14eb7350df82c3
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
