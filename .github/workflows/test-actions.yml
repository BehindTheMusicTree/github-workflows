name: Test actions

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  trigger-coolify-deploy-tests:
    name: trigger-coolify-deploy shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run deployment_uuid format tests
        run: bash .github/actions/trigger-coolify-deploy/tests/deployment_uuid_format.sh

      - name: Run stale-deployment filter tests
        run: bash .github/actions/trigger-coolify-deploy/tests/stale_deployment_filter.sh

  check-api-version-tests:
    name: check-api-version shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run check-api-version tests
        run: bash .github/actions/check-api-version/tests/check_api_version.sh

  agent-drift-tests:
    name: agent drift fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: BehindTheMusicTree/agent-config
          ref: 1e199e26e8c5d8778d94547b96d42d6c075bc7e7
          path: .agent-config-engine
          persist-credentials: false
      - name: Verify compliant and divergent fixtures
        run: bash .github/tests/agent-drift.sh "$GITHUB_WORKSPACE/.agent-config-engine/scripts/check-project-agents.py"
