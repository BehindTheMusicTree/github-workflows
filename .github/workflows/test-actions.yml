name: Test actions

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: test-actions-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trigger-coolify-deploy-tests:
    name: trigger-coolify-deploy shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run deployment_uuid format tests
        run: bash .github/actions/trigger-coolify-deploy/tests/deployment_uuid_format.sh

      - name: Run stale-deployment filter tests
        run: bash .github/actions/trigger-coolify-deploy/tests/stale_deployment_filter.sh

  check-api-version-tests:
    name: check-api-version shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run check-api-version tests
        run: bash .github/actions/check-api-version/tests/check_api_version.sh

  agent-drift-tests:
    name: agent drift fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: BehindTheMusicTree/agent-config
          ref: 1e199e26e8c5d8778d94547b96d42d6c075bc7e7
          path: .agent-config-engine
          persist-credentials: false
      - name: Verify compliant and divergent fixtures
        run: bash .github/tests/agent-drift.sh "$GITHUB_WORKSPACE/.agent-config-engine/scripts/check-project-agents.py"
      # Org conformance shares this required context so adding it needs no ruleset change.
      - name: Lint org conformance scripts
        if: ${{ !cancelled() }}
        run: shellcheck conformance/check-concurrency.sh .github/tests/check-concurrency.sh .github/tests/examples.sh
      - name: Verify workflow concurrency fixtures
        if: ${{ !cancelled() }}
        run: bash .github/tests/check-concurrency.sh
      - name: Verify examples pass the shipped conformance checks
        if: ${{ !cancelled() }}
        run: bash .github/tests/examples.sh

  coverage-tests:
    name: coverage workflow fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify thresholds, missing data and patch coverage
        run: bash .github/tests/coverage.sh

  release-script-tests:
    name: release script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify prepare and publish
        run: bash .github/scripts/tests/release.sh

  release-foundation-tests:
    name: release foundation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install Python artifact test tools
        run: python3 -m pip install build twine setuptools wheel
      - name: Verify validation, collisions and retries without remote writes
        run: python3 -m unittest discover -s release -p 'test_*.py'
      - name: Verify npm partial-publication recovery with a simulated registry
        run: node --test release/test_npm_artifact.cjs
      - name: Lint release shell scripts
        run: shellcheck .github/scripts/release.sh .github/scripts/tests/release.sh
