# Validates that a pull request title is a conventional commit subject.
# With squash merges and PR_TITLE as the commit title, the title is what release-please reads from main.
# The caller must run on pull_request with types [opened, edited, synchronize, reopened] and grant pull-requests: read.
name: PR title

on:
  workflow_call:
    inputs:
      types:
        description: Newline-separated conventional commit types allowed in the title
        type: string
        required: false
        default: |
          feat
          fix
          perf
          refactor
          docs
          test
          build
          ci
          chore
          revert

permissions:
  pull-requests: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
          requireScope: false
          # release-please changelog entries start lowercase.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must not start with an uppercase letter.
