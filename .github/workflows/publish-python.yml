name: Prepare Python publication

on:
  workflow_call:
    inputs:
      release-tag:
        description: Tag output of a release-tag.yml job in the same run (for example needs.tag-graph.outputs.tag)
        required: true
        type: string
      registry:
        description: Target registry, pypi or testpypi; any other value fails before the build
        default: pypi
        type: string
      package-name:
        description: PyPI project name declared in the caller's release policy packages
        required: true
        type: string
      package-directory:
        description: Repository-relative package directory to build (no symlinks)
        default: '.'
        type: string
      release-policy-path:
        description: Repository-relative release policy; paths inside it remain repository-relative
        default: .github/release-policy.json
        type: string
      python-version:
        description: Python version used to build the wheel and sdist
        default: '3.12'
        type: string
      artifact-name:
        description: Artifact containing the wheel, sdist and SHA-256 manifest
        default: python-distributions
        type: string
    outputs:
      version:
        description: Validated stable release version
        value: ${{ jobs.build.outputs.version }}
      artifact-name:
        description: Artifact to download in the caller's Trusted Publishing job
        value: ${{ inputs.artifact-name }}
      foundation-sha:
        description: Exact foundation commit to use for retry verification
        value: ${{ jobs.build.outputs.foundation-sha }}
      registry:
        description: Validated registry to pass to the helper in the caller's publication job
        value: ${{ inputs.registry }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      foundation-sha: ${{ steps.foundation.outputs.sha }}
    steps:
      - name: Require the caller-pinned workflow commit
        id: foundation
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Workflow commit SHA unavailable' >&2; exit 1; }
          test "$WORKFLOW_REPOSITORY" = BehindTheMusicTree/github-workflows
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
      - name: Require a main push, a release tag and a known registry
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DELETED: ${{ github.event.deleted }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          test "$EVENT" = push
          test "$REF" = refs/heads/main
          test "$DELETED" = false
          test -n "$RELEASE_TAG" || { echo 'release-tag is empty: no release tag was created in this run' >&2; exit 1; }
          case "$REGISTRY" in
            pypi|testpypi) ;;
            *) echo "Unknown registry: $REGISTRY" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: caller
      - name: Fetch the release tag
        working-directory: caller
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The checkout drops credentials, so authenticate this one fetch (read-only token) instead of persisting them.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0 2>/dev/null || printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          echo "::add-mask::$auth"
          # A tag just created through the API can take a moment to be served by git.
          for attempt in 1 2 3 4 5 6; do
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" && exit 0
            echo "Tag $RELEASE_TAG not yet fetchable (attempt $attempt/6)" >&2
            sleep 5
          done
          echo "Tag $RELEASE_TAG could not be fetched" >&2
          exit 1
      - uses: actions/checkout@v5
        with:
          repository: BehindTheMusicTree/github-workflows
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: foundation
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Validate tag provenance and publication contract
        id: release
        working-directory: caller
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          PACKAGE: ${{ inputs.package-name }}
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
          RELEASE_POLICY_PATH: ${{ inputs.release-policy-path }}
        run: |
          python3 - <<'PY'
          import os
          import runpy
          from pathlib import Path
          helper = runpy.run_path('../foundation/release/python-artifact.py')
          version = helper['source_version'](
              os.environ['PACKAGE'], os.environ['RELEASE_TAG'],
              package_directory_path=os.environ['PACKAGE_DIRECTORY'],
              release_policy_path=os.environ['RELEASE_POLICY_PATH'])
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Build and check wheel and sdist
        working-directory: caller
        env:
          PACKAGE: ${{ inputs.package-name }}
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          python3 -m pip install build twine
          python3 -m build "$PACKAGE_DIRECTORY" --outdir "$RUNNER_TEMP/python-dist"
          python3 -m twine check --strict "$RUNNER_TEMP/python-dist/"*
          python3 ../foundation/release/python-artifact.py manifest "$PACKAGE" "$VERSION" "$RUNNER_TEMP/python-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/python-dist/
          if-no-files-found: error
