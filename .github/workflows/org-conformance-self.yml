name: Org conformance (self)

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: org-conformance-self-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  org-conformance:
    uses: ./.github/workflows/org-conformance.yml
    permissions:
      contents: read
