name: Publish GitHub-only release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require the caller-pinned workflow commit
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Workflow commit SHA unavailable' >&2; exit 1; }
          test "$WORKFLOW_REPOSITORY" = BehindTheMusicTree/github-workflows || { echo 'Unexpected workflow repository' >&2; exit 1; }
      - name: Require a tag push
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DELETED: ${{ github.event.deleted }}
        run: |
          test "$EVENT" = push
          test "$REF_TYPE" = tag
          test "$DELETED" = false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: caller
      - uses: actions/checkout@v5
        with:
          repository: BehindTheMusicTree/github-workflows
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: foundation
      - name: Validate and publish the existing tag
        working-directory: caller
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../foundation/release/github-release.py publish
