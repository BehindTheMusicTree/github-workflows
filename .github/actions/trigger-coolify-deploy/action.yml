# App-agnostic composite action: trigger a Coolify application deploy via API and wait
# for it to finish (and optionally become healthy) before returning.
# Used to enforce cross-application deploy ordering (e.g. api before web) from GitHub
# Actions instead of relying on Coolify's native, unordered git-push auto-deploy.
name: Trigger Coolify deploy

description: Trigger a Coolify application deploy via API, wait for it to finish, and optionally health-check it

inputs:
  app_name:
    description: "Coolify application name (e.g. tmd-admin-api)"
    required: true
  coolify_environment:
    description: "Coolify environment name (production or staging)"
    required: true
  coolify_subdomain:
    description: "Coolify subdomain (e.g. coolify)"
    required: true
  domain:
    description: "Base domain (e.g. example.com)"
    required: true
  coolify_api_token:
    description: "Coolify API token (composite actions have no secrets: block — pass via with:)"
    required: true
  pr_number:
    description: "PR number to target a PR-preview deployment instead of the regular one"
    required: false
    default: ""
  force:
    description: "Force a fresh deploy even if the commit is already deployed"
    required: false
    default: "false"
  poll_timeout_seconds:
    description: "Max seconds to wait for the deployment (and health check, if any) to finish"
    required: false
    default: "1800"
  poll_interval_seconds:
    description: "Seconds between deployment/health-check polls"
    required: false
    default: "15"
  preview_not_found_timeout_seconds:
    description: >-
      Max seconds to retry triggering a PR-preview deploy while Coolify hasn't created the
      ApplicationPreview record yet (races Coolify's own webhook-driven preview creation).
      Ignored when pr_number is not set.
    required: false
    default: "180"
  health_check_path:
    description: "Optional path (e.g. /health) to poll for HTTP 200 after the deployment finishes"
    required: false
    default: ""
  health_check_base_url_override:
    description: >-
      Base URL to health-check against instead of the application's own fqdn. Required when
      both pr_number and health_check_path are set, since Coolify's API doesn't expose a
      preview's generated fqdn.
    required: false
    default: ""
  health_check_origin_ip:
    description: >-
      Origin server IP to connect the health check directly to (via curl --resolve), bypassing
      any reverse proxy in front of the health-check hostname. Required for hostnames proxied
      through Cloudflare: Cloudflare's Bot Fight Mode issues an instant JS challenge (HTTP 403)
      to GitHub Actions runner IPs on any proxied hostname, and it runs outside the Ruleset
      Engine, so no Cloudflare Custom Rule can exempt it — the only way to reach the app's real
      health check is to skip the proxy for this one request. TLS still validates normally
      since the hostname (SNI/Host) is unchanged, only the connect-to address is overridden.
    required: false
    default: ""
  server_host:
    description: >-
      VPS host to SSH into to force-stop a still-running native (webhook-triggered) preview
      build that would otherwise keep consuming a build slot after this action's own deploy has
      started (Coolify's cancel API only marks an in-progress deployment cancelled in the DB —
      it does not stop the build process: coollabsio/coolify#5850). Required whenever pr_number
      is set — the action fails fast rather than silently skipping the force-stop.
    required: false
    default: ""
  server_deploy_username:
    description: "SSH username for server_host (see server_host)"
    required: false
    default: ""
  server_deploy_ssh_private_key:
    description: "SSH private key for server_host (see server_host)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check required build-kill inputs
      if: inputs.pr_number != ''
      shell: bash
      env:
        SERVER_HOST: ${{ inputs.server_host }}
        SERVER_DEPLOY_USERNAME: ${{ inputs.server_deploy_username }}
        SERVER_DEPLOY_SSH_PRIVATE_KEY: ${{ inputs.server_deploy_ssh_private_key }}
      run: |
        missing=()
        [ -z "$SERVER_HOST" ] && missing+=(server_host)
        [ -z "$SERVER_DEPLOY_USERNAME" ] && missing+=(server_deploy_username)
        [ -z "$SERVER_DEPLOY_SSH_PRIVATE_KEY" ] && missing+=(server_deploy_ssh_private_key)
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "ERROR: pr_number is set but missing required input(s): ${missing[*]}." >&2
          echo "PR-preview deploys must be able to force-stop a stuck native build (coollabsio/coolify#5850) — no silent fallback." >&2
          exit 1
        fi

    - name: Set up SSH for build-kill fallback
      if: inputs.pr_number != ''
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.server_deploy_ssh_private_key }}

    - name: Add server to known_hosts
      if: inputs.pr_number != ''
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H "${{ inputs.server_host }}" >> ~/.ssh/known_hosts

    - name: Trigger deploy and wait
      shell: bash
      env:
        APP_NAME: ${{ inputs.app_name }}
        COOLIFY_ENVIRONMENT: ${{ inputs.coolify_environment }}
        COOLIFY_SUBDOMAIN: ${{ inputs.coolify_subdomain }}
        DOMAIN: ${{ inputs.domain }}
        COOLIFY_API_TOKEN: ${{ inputs.coolify_api_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        FORCE: ${{ inputs.force }}
        POLL_TIMEOUT_SECONDS: ${{ inputs.poll_timeout_seconds }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        PREVIEW_NOT_FOUND_TIMEOUT_SECONDS: ${{ inputs.preview_not_found_timeout_seconds }}
        HEALTH_CHECK_PATH: ${{ inputs.health_check_path }}
        HEALTH_CHECK_BASE_URL_OVERRIDE: ${{ inputs.health_check_base_url_override }}
        HEALTH_CHECK_ORIGIN_IP: ${{ inputs.health_check_origin_ip }}
        SERVER_HOST: ${{ inputs.server_host }}
        SERVER_DEPLOY_USERNAME: ${{ inputs.server_deploy_username }}
      run: |
        set -euo pipefail

        COOLIFY_API_URL="https://${COOLIFY_SUBDOMAIN}.${DOMAIN}"

        echo "Looking up Coolify app '${APP_NAME}' in environment '${COOLIFY_ENVIRONMENT}'..."

        # /api/v1/applications only exposes environment_id (no nested environment name),
        # so resolve the target environment's id(s) across all projects first.
        projects=$(curl -sf -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
          "${COOLIFY_API_URL}/api/v1/projects")

        env_ids="[]"
        for project_uuid in $(echo "$projects" | jq -r '.[].uuid'); do
          project=$(curl -sf -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_API_URL}/api/v1/projects/${project_uuid}")
          ids=$(echo "$project" | jq -c --arg env "$COOLIFY_ENVIRONMENT" \
            '[.environments[] | select(.name == $env) | .id]')
          env_ids=$(jq -c -n --argjson a "$env_ids" --argjson b "$ids" '$a + $b')
        done

        apps=$(curl -sf -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
          "${COOLIFY_API_URL}/api/v1/applications")
        app_uuid=$(echo "$apps" | jq -r \
          --arg name "$APP_NAME" \
          --argjson env_ids "$env_ids" \
          '.[] | select(.name == $name and (.environment_id | IN($env_ids[]))) | .uuid' | head -1)
        if [ -z "$app_uuid" ]; then
          echo "ERROR: No Coolify app found with name '${APP_NAME}' in environment '${COOLIFY_ENVIRONMENT}'"
          exit 1
        fi
        echo "Found app UUID: ${app_uuid}"

        deploy_url="${COOLIFY_API_URL}/api/v1/deploy?uuid=${app_uuid}&force=${FORCE}"
        if [ -n "$PR_NUMBER" ]; then
          deploy_url="${deploy_url}&pr=${PR_NUMBER}"
        fi

        trigger_deploy() {
          curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "$deploy_url"
        }

        response=""
        http_code=""
        if [ -n "$PR_NUMBER" ]; then
          echo "Triggering deploy for PR #${PR_NUMBER} preview (retrying up to ${PREVIEW_NOT_FOUND_TIMEOUT_SECONDS}s if the preview doesn't exist yet)..."
          start=$(date +%s)
          while :; do
            raw=$(trigger_deploy)
            http_code=$(printf '%s' "$raw" | tail -1)
            response=$(printf '%s' "$raw" | sed '$d')
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              break
            fi
            if printf '%s' "$response" | grep -qi "not found"; then
              elapsed=$(( $(date +%s) - start ))
              if [ "$elapsed" -ge "$PREVIEW_NOT_FOUND_TIMEOUT_SECONDS" ]; then
                echo "ERROR: PR #${PR_NUMBER} preview not found after ${PREVIEW_NOT_FOUND_TIMEOUT_SECONDS}s: ${response}"
                exit 1
              fi
              echo "  Preview not found yet (${elapsed}s elapsed) — retrying..."
              sleep "$POLL_INTERVAL_SECONDS"
              continue
            fi
            echo "ERROR: HTTP ${http_code} triggering deploy: ${response}"
            exit 1
          done
        else
          echo "Triggering deploy..."
          raw=$(trigger_deploy)
          http_code=$(printf '%s' "$raw" | tail -1)
          response=$(printf '%s' "$raw" | sed '$d')
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "ERROR: HTTP ${http_code} triggering deploy: ${response}"
            exit 1
          fi
        fi

        deployment_uuid=$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid // empty')
        if [ -z "$deployment_uuid" ]; then
          echo "ERROR: No deployment_uuid in response: ${response}"
          exit 1
        fi
        echo "Deployment queued: ${deployment_uuid}"

        if [ -n "$PR_NUMBER" ]; then
          echo "Checking for a still-running native (webhook-triggered) preview build to stop..."
          set +e
          phantoms=$(curl -sf -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_API_URL}/api/v1/deployments/applications/${app_uuid}?take=20" | jq -c \
            --arg pr "$PR_NUMBER" --arg mine "$deployment_uuid" \
            '.[]? | select((.pull_request_id | tostring) == $pr and .is_webhook == true and (.status == "queued" or .status == "in_progress") and .deployment_uuid != $mine)')
          set -e
          while IFS= read -r phantom; do
            [ -z "$phantom" ] && continue
            phantom_uuid=$(printf '%s' "$phantom" | jq -r '.deployment_uuid')
            phantom_status=$(printf '%s' "$phantom" | jq -r '.status')

            echo "  Cancelling native deploy ${phantom_uuid} (PR #${PR_NUMBER}, was ${phantom_status})..."
            curl -s -o /dev/null -X POST -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_URL}/api/v1/deployments/${phantom_uuid}/cancel" || true

            if [ "$phantom_status" != "in_progress" ]; then
              continue
            fi
            # Coolify's cancel endpoint only marks an already-running deployment cancelled
            # in the DB — the build process itself keeps running unattended in the
            # background (upstream bug: coollabsio/coolify#5850). The only real kill is
            # docker stop on the build container, which Coolify names after the
            # deployment_uuid (see ApplicationDeploymentJob::graceful_shutdown_container).
            # SERVER_HOST/SERVER_DEPLOY_USERNAME presence is already enforced by the
            # "Check required build-kill inputs" step — no fallback here.
            if ! printf '%s' "$phantom_uuid" | grep -qE '^[0-9a-f-]{36}$'; then
              echo "  WARNING: unexpected deployment_uuid format '${phantom_uuid}', skipping force-stop"
              continue
            fi
            echo "  Force-stopping in-progress native build container ${phantom_uuid} via SSH..."
            ssh -o StrictHostKeyChecking=accept-new "${SERVER_DEPLOY_USERNAME}@${SERVER_HOST}" \
              "docker stop --time 5 ${phantom_uuid}" \
              || echo "  WARNING: failed to stop ${phantom_uuid} (may have already finished)"
          done <<< "$phantoms"
        fi

        echo "Polling deployment status (timeout ${POLL_TIMEOUT_SECONDS}s)..."
        start=$(date +%s)
        status=""
        while :; do
          status=$(curl -sf -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_API_URL}/api/v1/deployments/${deployment_uuid}" | jq -r '.status // empty')
          case "$status" in
            finished)
              echo "Deployment finished."
              break
              ;;
            failed|cancelled-by-user)
              echo "ERROR: Deployment ended with status '${status}'"
              exit 1
              ;;
          esac
          elapsed=$(( $(date +%s) - start ))
          if [ "$elapsed" -ge "$POLL_TIMEOUT_SECONDS" ]; then
            echo "ERROR: Timed out after ${POLL_TIMEOUT_SECONDS}s waiting for deployment (last status: '${status}')"
            exit 1
          fi
          sleep "$POLL_INTERVAL_SECONDS"
        done

        if [ -n "$HEALTH_CHECK_PATH" ]; then
          if [ -n "$PR_NUMBER" ]; then
            if [ -z "$HEALTH_CHECK_BASE_URL_OVERRIDE" ]; then
              echo "ERROR: health_check_base_url_override is required when both pr_number and health_check_path are set"
              exit 1
            fi
            base_url="$HEALTH_CHECK_BASE_URL_OVERRIDE"
          else
            base_url=$(curl -sf -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_URL}/api/v1/applications/${app_uuid}" | jq -r '.fqdn // empty' | cut -d',' -f1)
            if [ -z "$base_url" ]; then
              echo "ERROR: Could not resolve application fqdn for health check"
              exit 1
            fi
            case "$base_url" in
              http*) : ;;
              *) base_url="https://${base_url}" ;;
            esac
          fi

          health_url="${base_url%/}${HEALTH_CHECK_PATH}"

          resolve_opts=()
          if [ -n "$HEALTH_CHECK_ORIGIN_IP" ]; then
            health_host=$(printf '%s' "$base_url" | sed -E 's#^[a-zA-Z]+://##; s#[/:].*##')
            resolve_opts=(--resolve "${health_host}:443:${HEALTH_CHECK_ORIGIN_IP}")
            echo "Health-checking ${health_url} directly via ${HEALTH_CHECK_ORIGIN_IP} (bypassing any proxy in front of ${health_host}), timeout ${POLL_TIMEOUT_SECONDS}s..."
          else
            echo "Health-checking ${health_url} (timeout ${POLL_TIMEOUT_SECONDS}s)..."
          fi

          start=$(date +%s)
          while :; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${resolve_opts[@]}" "$health_url" || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed."
              break
            fi
            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -ge "$POLL_TIMEOUT_SECONDS" ]; then
              echo "ERROR: Timed out after ${POLL_TIMEOUT_SECONDS}s waiting for ${health_url} to return 200 (last: ${code})"
              exit 1
            fi
            sleep "$POLL_INTERVAL_SECONDS"
          done
        fi

        echo "Done — '${APP_NAME}' (${COOLIFY_ENVIRONMENT}) deployed${HEALTH_CHECK_PATH:+ and healthy}."
