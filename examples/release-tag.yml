# Place at .github/workflows/release-tag.yml in an adopting repository.
# GitHub-only policies are published by this job: do not add a separate tag-triggered publisher.
name: Release tag
on:
  push:
    branches: [main]
permissions:
  contents: read
# One run per pushed commit, never cancelled or replaced: release-tag validates only before..after, so a replaced run would leave its bump untagged.
concurrency:
  group: release-tag-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
    # Replace with the full merged, reviewed github-workflows commit SHA.
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-tag.yml@REPLACE_WITH_MERGED_COMMIT_SHA
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
